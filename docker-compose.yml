services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-init:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    command: >
      bash -lc "
        psql -h db -U \"$POSTGRES_USER\" -d postgres -v ON_ERROR_STOP=1 -c
        \"DO $$
         BEGIN
           IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sonarqube') THEN
             EXECUTE 'CREATE DATABASE sonarqube
                      WITH ENCODING ''UTF8'' TEMPLATE template0';
           END IF;
         END
         $$;\"
      "
    restart: "no"
    profiles: [ "tools" ]

  sonarqube:
    image: sonarqube:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
      SONAR_JDBC_URL: ${SONAR_JDBC_URL}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.4
    environment:
      DEBUG: 1
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/aws/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/sqs-init.done"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  app-dev:
    image: golang:1.25.1
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      PG_DSN: ${PG_DSN}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      SQS_BASE_URL: ${SQS_BASE_URL}
      AWS_BASE_SNS_ARN: ${AWS_BASE_SNS_ARN}
    command: tail -f /dev/null
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy  
    ports: ["8080:8080"]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - ./:/usr/src
    working_dir: /usr/src
    profiles:
      - tools

volumes:
  pgdata:
  go-mod:
  go-build:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp: