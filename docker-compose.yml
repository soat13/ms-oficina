services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app-dev:
    image: golang:1.25.1
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      PG_DSN: postgres://postgres:postgres@db:5432/oficina?sslmode=disable
      JWT_SECRET: dev
    command: tail -f /dev/null
    depends_on:
      db:
        condition: service_healthy
    ports: ["80:8080"]

volumes:
  pgdata:
  go-mod:
  go-build:
