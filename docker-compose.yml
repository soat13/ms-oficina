services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  dev:
    image: golang:1.25.1
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/oficina?sslmode=disable
      JWT_SECRET: dev
    command: tail -f /dev/null
    depends_on: [db]
    ports: ["80:8080"]

volumes:
  pgdata:
  go-mod:
  go-build:
