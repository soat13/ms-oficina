name: Deploy to Kubernetes

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      K8S_JWT_SECRET:
        required: true
      TF_RDS_MASTER_USERNAME:
        required: true
      TF_RDS_MASTER_PASSWORD:
        required: true

jobs:
  k8s-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Terraform Outputs
        id: tf_outputs
        run: |
          aws s3 cp s3://soatfiap-fase4/state/oficina-infra/terraform.tfstate infra.tfstate
          aws s3 cp s3://soatfiap-fase4/state/oficina-db/terraform.tfstate db.tfstate

          CLUSTER_NAME=$(jq -r '.outputs.cluster_name.value' infra.tfstate)
          RDS_ENDPOINT=$(jq -r '.outputs.rds_address.value' db.tfstate)
          RDS_PORT=$(jq -r '.outputs.rds_port.value' db.tfstate)
          RDS_DATABASE=$(jq -r '.outputs.rds_database_name.value' db.tfstate)

          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "rds_port=${RDS_PORT}" >> $GITHUB_OUTPUT
          echo "rds_database=${RDS_DATABASE}" >> $GITHUB_OUTPUT

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf_outputs.outputs.cluster_name }}" \
            --region ${{ env.AWS_REGION }}

      - name: Apply Namespace and Base Resources
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/serviceaccount.yaml
          kubectl apply -f deploy/k8s/configmap.yaml

      - name: Apply Kubernetes Secret
        env:
          JWT_SECRET: ${{ secrets.K8S_JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.TF_RDS_MASTER_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.TF_RDS_MASTER_PASSWORD }}
          POSTGRES_DB: ${{ steps.tf_outputs.outputs.rds_database }}
          PG_DSN: postgres://${{ secrets.TF_RDS_MASTER_USERNAME }}:${{ secrets.TF_RDS_MASTER_PASSWORD }}@${{ steps.tf_outputs.outputs.rds_endpoint }}:${{ steps.tf_outputs.outputs.rds_port }}/${{ steps.tf_outputs.outputs.rds_database }}
        run: |
          envsubst < deploy/k8s/secrets.yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          kubectl apply -f deploy/k8s/metric-server.yaml
          kubectl apply -f deploy/k8s/app.yaml
          kubectl apply -f deploy/k8s/services.yaml
          kubectl apply -f deploy/k8s/hpa.yaml

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout restart deployment/oficina -n fiap
