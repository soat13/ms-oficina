name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: |
          go test -v \
            -coverpkg=./internal/...,./pkg/... \
            -coverprofile=unit-coverage.out \
            ./internal/... ./pkg/...

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: unit-coverage.out
          retention-days: 1

  docker-build:
    name: Docker Build
    needs: unit-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          context: .
          push: false
          tags: oficina-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    name: Integration Tests & Quality
    needs: [unit-tests, docker-build]
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Create .env.testing
        run: |
          cat <<EOF > .env.testing
          PG_DSN=postgres://postgres:postgres@127.0.0.1:5432/oficina?sslmode=disable
          MIGRATIONS_DIR=scripts/db/migrations
          TEST_SEEDERS_DIR=scripts/db/test_seeders
          EOF

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Download Unit Coverage
        uses: actions/download-artifact@v6
        with:
          name: unit-coverage

      - name: Run Integration Tests
        run: |
          go test -v \
            -coverpkg=./internal/...,./pkg/... \
            -coverprofile=integration-coverage.out \
            ./tests/integration/...

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=unit-coverage.out,integration-coverage.out
