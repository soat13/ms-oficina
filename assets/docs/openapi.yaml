  /admin/users:
    get:
      tags: [Users]
      summary: Listar usuários
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Users]
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuário criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '409':
          description: Documento ou e-mail já cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Users]
      summary: Obter usuário por ID
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Users]
      summary: Atualizar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204':
          description: Usuário atualizado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Documento ou e-mail já cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Users]
      summary: Remover usuário
      responses:
        '204':
          description: Usuário removido.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders:
    get:
      tags: [Repair Orders]
      summary: Listar ordens de reparo
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de ordens de reparo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrderListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Repair Orders]
      summary: Criar ordem de reparo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderCreateRequest'
      responses:
        '201':
          description: Ordem de reparo criada.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '404':
          description: Cliente ou veículo não encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/average-execution-time:
    get:
      tags: [Repair Orders]
      summary: Obter tempo médio de execução
      responses:
        '200':
          description: Tempo médio em minutos (pode ser nulo se inexistente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageExecutionTimeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Repair Orders]
      summary: Obter ordem de reparo por ID
      responses:
        '200':
          description: Ordem de reparo encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Repair Orders]
      summary: Cancelar ordem de reparo
      responses:
        '204':
          description: Ordem cancelada.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}/start-execution:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Repair Orders]
      summary: Iniciar execução da ordem
      responses:
        '204':
          description: Execução iniciada.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}/finish-execution:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Repair Orders]
      summary: Finalizar execução da ordem
      responses:
        '204':
          description: Execução finalizada.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}/release-vehicle:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Repair Orders]
      summary: Liberar veículo
      responses:
        '204':
          description: Veículo liberado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/repair-orders/{id}/estimate:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Estimates]
      summary: Criar orçamento para ordem de reparo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateCreateRequest'
      responses:
        '201':
          description: Orçamento criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/estimates/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Estimates]
      summary: Aprovar orçamento
      responses:
        '200':
          description: Orçamento aprovado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/estimates/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    post:
      tags: [Estimates]
      summary: Rejeitar orçamento
      responses:
        '200':
          description: Orçamento rejeitado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Transição de status não permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Número máximo de registros a retornar.
      schema:
        type: integer
        minimum: 1
        default: 50
    OffsetParam:
      name: offset
      in: query
      description: Quantidade de registros a ignorar antes de retornar resultados.
      schema:
        type: integer
        minimum: 0
        default: 0
    ResourceIdParam:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        type: string
        format: uuid
    CustomerIdParam:
      name: customerId
      in: path
      required: true
      description: Identificador do cliente.
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedResponse:
      description: Token ausente ou inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidJSONResponse:
      description: Corpo JSON inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidBodyResponse:
      description: Falha de validação no corpo da requisição.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidIDResponse:
      description: Identificador inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundResponse:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_JSON
        message:
          type: string
          example: invalid JSON body
    LoginRequest:
      type: object
