openapi: "3.0.3"
info:
  title: Oficina API
  version: 1.0.0
  description: |-
    API da Oficina (Fase 1).

    Utilize `POST /auth/login` para obter um token JWT e, em seguida, informe `Bearer <token>` no cabeçalho `Authorization` ao chamar as rotas protegidas. No Swagger UI, use o botão **Authorize** para registrar o token.
servers:
  - url: http://localhost:8080
    description: Ambiente local (PORT=8080)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Fluxo de autenticação e emissão de tokens JWT.
  - name: Users
    description: Administração de usuários internos.
  - name: Customers
    description: Cadastro de clientes.
  - name: Vehicles
    description: Cadastro de veículos vinculados a clientes.
  - name: Services
    description: Catálogo de serviços oferecidos.
  - name: Products
    description: Catálogo de produtos e controle de estoque.
  - name: Repair Orders
    description: Gerenciamento das ordens de reparo.
  - name: Estimates
    description: Orçamentos gerados a partir de ordens de reparo.
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário
      description: Retorna um token JWT válido para acessar as rotas protegidas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password123
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/services:
    get:
      tags: [Services]
      summary: Listar serviços
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de serviços.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Services]
      summary: Criar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        '201':
          description: Serviço criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '409':
          description: Serviço com mesmo nome já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Services]
      summary: Obter serviço por ID
      responses:
        '200':
          description: Serviço encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Services]
      summary: Atualizar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
      responses:
        '204':
          description: Serviço atualizado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Serviço com mesmo nome já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Services]
      summary: Remover serviço
      responses:
        '204':
          description: Serviço removido.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/products:
    get:
      tags: [Products]
      summary: Listar produtos
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Products]
      summary: Criar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Produto criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '409':
          description: Produto com mesmo nome já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Products]
      summary: Obter produto por ID
      responses:
        '200':
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Products]
      summary: Atualizar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '204':
          description: Produto atualizado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Produto com mesmo nome já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Products]
      summary: Remover produto
      responses:
        '204':
          description: Produto removido.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/customers:
    get:
      tags: [Customers]
      summary: Listar clientes
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Customers]
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Cliente criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '409':
          description: Documento ou e-mail já cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Customers]
      summary: Obter cliente por ID
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Customers]
      summary: Atualizar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '204':
          description: Cliente atualizado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Documento ou e-mail já cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Customers]
      summary: Remover cliente
      responses:
        '204':
          description: Cliente removido.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/customers/{customerId}/vehicles:
    parameters:
      - $ref: '#/components/parameters/CustomerIdParam'
    get:
      tags: [Vehicles]
      summary: Listar veículos por cliente
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Veículos do cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /admin/vehicles:
    get:
      tags: [Vehicles]
      summary: Listar veículos
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de veículos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Vehicles]
      summary: Criar veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '201':
          description: Veículo criado.
        '400':
          $ref: '#/components/responses/InvalidJSONResponse'
        '409':
          description: Placa já cadastrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /admin/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Vehicles]
      summary: Obter veículo por ID
      responses:
        '200':
          description: Veículo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Vehicles]
      summary: Atualizar veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdateRequest'
      responses:
        '204':
          description: Veículo atualizado.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Placa já cadastrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidBodyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Vehicles]
      summary: Remover veículo
      responses:
        '204':
          description: Veículo removido.
        '400':
          $ref: '#/components/responses/InvalidIDResponse'
        '404':
