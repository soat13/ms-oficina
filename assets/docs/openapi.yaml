openapi: "3.0.3"
info:
  title: Oficina API
  version: 1.0.0
  description: |-
    API da Oficina (Fase 1).

    Utilize `POST /auth/login` para obter um token JWT e, em seguida, informe `Bearer <token>` no cabeçalho `Authorization` ao chamar as rotas protegidas. No Swagger UI, use o botão **Authorize** para registrar o token.
servers:
  - url: http://localhost:8080
    description: Ambiente local (PORT=8080)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Fluxo de autenticação e emissão de tokens JWT.
  - name: Users
    description: Administração de usuários internos.
  - name: Customers
    description: Cadastro de clientes.
  - name: Vehicles
    description: Cadastro de veículos vinculados a clientes.
  - name: Services
    description: Catálogo de serviços oferecidos.
  - name: Products
    description: Catálogo de produtos e controle de estoque.
  - name: Repair Orders
    description: Gerenciamento das ordens de reparo.
  - name: Estimates
    description: Orçamentos gerados a partir de ordens de reparo.
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário
      description: Retorna um token JWT válido para acessar as rotas protegidas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password123
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "400"
                message: invalid JSON body
        '401':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "401"
                message: invalid credentials
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
  /admin/services:
    get:
      tags: [Services]
      summary: Listar serviços
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de serviços.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Services]
      summary: Criar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        '201':
          description: Serviço criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: Corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "400"
                message: invalid JSON body
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          description: Serviço duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "409"
                message: service with this name already exists
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
  /admin/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceIdParam'
    get:
      tags: [Services]
      summary: Obter serviço por ID
      responses:
        '200':
          description: Serviço encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "400"
                message: invalid ID
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Serviço não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "404"
                message: service not found
    patch:
      tags: [Services]
      summary: Atualizar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
      responses:
        '204':
          description: Serviço atualizado.
        '400':
          description: ID inválido ou corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidId:
                  value:
                    code: "400"
                    message: invalid ID
                invalidJson:
                  value:
                    code: "400"
                    message: invalid JSON body
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Serviço não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "404"
                message: service not found
        '409':
          description: Serviço duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "409"
                message: service with this name already exists
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
    delete:
      tags: [Services]
      summary: Remover serviço
      responses:
        '204':
          description: Serviço removido.
        '400':
          description: ID inválido.
          content:
