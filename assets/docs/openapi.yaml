    DiagnosticServiceItem:
      type: object
      required: [id, quantity]
      properties:
        id:
          type: string
          format: uuid
          description: ID do serviço.
        quantity:
          type: integer
          minimum: 1
          description: Quantidade do serviço.
    FinishDiagnosticsRequest:
      type: object
      required: [products, services]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticProductItem'
          minItems: 1
          description: Lista de produtos necessários para o reparo.
        services:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticServiceItem'
          minItems: 1
          description: Lista de serviços necessários para o reparo.
      description: É necessário informar ao menos um produto e um serviço para finalizar o diagnóstico.
    AddItemRequest:
      type: object
      required: [item_id, quantity]
