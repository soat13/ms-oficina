                    message: estimate must have at least one item
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Número máximo de registros a retornar.
      schema:
        type: integer
        minimum: 1
        default: 50
    OffsetParam:
      name: offset
      in: query
      description: Quantidade de registros a ignorar antes de retornar resultados.
      schema:
        type: integer
        minimum: 0
        default: 0
    ResourceIdParam:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        type: string
        format: uuid
    CustomerIdParam:
      name: customerId
      in: path
      required: true
      description: Identificador do cliente.
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedResponse:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              value:
                code: "401"
                message: missing authorization token
            invalidToken:
              value:
                code: "401"
                message: invalid token
            expiredToken:
              value:
                code: "401"
                message: token expired
    InvalidJSONResponse:
      description: Corpo JSON inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityResponse:
      description: Entidade não processável (erros de validação ou regras de negócio).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InvalidIDResponse:
      description: Identificador inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundResponse:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictResponse:
      description: Conflito (recurso duplicado ou operação inválida).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_JSON
        message:
          type: string
          example: invalid JSON body
    IdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID do recurso criado.
    ValidationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_BODY
        message:
          type: string
          example: Body validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: password
              message:
                type: string
                example: Password is a required field
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthenticatedUser:
      type: object
      required: [id, name, email, roles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Tempo (em segundos) até a expiração do token.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    Service:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
          format: int64
          description: Preço do serviço em centavos (BRL).
    ServiceCreateRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 3
        price:
          type: integer
          format: int64
          minimum: 1
          description: Preço do serviço em centavos (BRL).
    ServiceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        price:
          type: integer
          format: int64
          minimum: 1
          description: Preço do serviço em centavos (BRL).
    ServiceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Product:
      type: object
      required: [id, name, price, stock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
          format: int64
          description: Preço do produto em centavos (BRL).
        stock:
          type: integer
          minimum: 0
    ProductCreateRequest:
      type: object
