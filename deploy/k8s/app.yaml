apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina
  namespace: fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina
  template:
    metadata:
      labels:
        app: oficina
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3
      containers:
        - image: 711290133650.dkr.ecr.us-east-1.amazonaws.com/oficina-api:latest
          imagePullPolicy: Always
          name: oficina-api
          ports:
          - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-sc
            - configMapRef:
                name: app-config
          resources:
            limits:
              cpu: 50m
              memory: 20Mi
            requests:
              cpu: 20m
              memory: 20Mi
