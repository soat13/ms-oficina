openapi: "3.0.3"
info:
  title: Oficina API
  version: 1.0.0
  description: |
    API da Oficina (Fase 1).

    Esta especificação documenta os endpoints HTTP atuais, seguindo as camadas e decisões de DDD do projeto.

    Observações:
    - O grupo de rotas de serviços é exposto sob `/admin/services`.
    - A criação de orçamento (estimate) é feita a partir de uma ordem de serviço específica.
    - As rotas que exigem autenticação JWT estão identificadas com o requisito de segurança `bearerAuth`. Cadastre o token através do botão **Authorize** usando `Bearer <token>` após obter um `access_token` em `/auth/login`.
servers:
  - url: http://localhost:8080
    description: Ambiente local (PORT=8080)
tags:
  - name: Auth
    description: Fluxo de autenticação e emissão de JWT
  - name: Services
    description: Catálogo de serviços (admin)
  - name: Products
    description: Catálogo de produtos (admin)
  - name: Estimates
    description: Orçamentos gerados a partir de ordens de serviço
  - name: Repair Orders
    description: Transição de status das ordens de reparo (admin)
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário
      description: Retorna um token JWT válido para acessar as rotas protegidas (`/admin/**`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password123
      responses:
        '200':
          description: Autenticação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
                expires_at: 2024-12-31T12:00:00Z
                user:
                  id: d290f1ee-6c54-4b01-90e6-d701748f0851
                  name: Admin User
                  email: admin@example.com
                  roles: [manager, attendant]
        '400':
          description: JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: invalid credentials
  /admin/services:
    get:
      tags: [Services]
      summary: Listar serviços
      description: Lista serviços com paginação simples por `limit` e `offset`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Número máximo de itens retornados.
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Deslocamento para paginação.
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesResponse'
              example:
                services:
                  - id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                    name: "Alinhamento e Balanceamento"
                    price_cents: 12000
                    currency: "BRL"
                  - id: "2d6b1a8f-9c4e-47f2-a1bc-1234567890ab"
                    name: "Troca de Óleo"
                    price_cents: 9000
                    currency: "BRL"
    post:
      tags: [Services]
      summary: Criar serviço
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
            example:
              name: "Alinhamento e Balanceamento"
              price_cents: 12000
              currency: "BRL"
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Alinhamento e Balanceamento"
                  price_cents: 12000
                  currency: "BRL"
        '400':
          description: JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "name: must be at least 3 characters"
        '409':
          description: Serviço já existe (nome duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_ALREADY_EXISTS
                message: service with this name already exists
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /admin/products:
    get:
      tags: [Products]
      summary: Listar produtos
      description: Lista produtos com paginação simples por `limit` e `offset`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Número máximo de itens retornados.
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Deslocamento para paginação.
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
              example:
                products:
                  - id: "7fdcb813-62ad-4d6d-80f5-750a6c31a808"
                    name: "Óleo Sintético 5W30"
                    price: 9500
                    stock: 25
                  - id: "0d8a4e57-c26f-4d67-910f-9a1fab5b52c4"
                    name: "Filtro de Óleo"
                    price: 4500
                    stock: 12
    post:
      tags: [Products]
      summary: Criar produto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              name: "Filtro de Cabine"
              price: 3800
              stock: 8
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                product:
                  id: "51f5e7da-b1cf-4bf6-8ec1-6a26dd4043ed"
                  name: "Filtro de Cabine"
                  price: 3800
                  stock: 8
        '400':
          description: JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "name: must be at least 3 characters"
        '409':
          description: Produto já existe (nome duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_ALREADY_EXISTS
                message: product.duplicate
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /admin/products/{id}:
    get:
      tags: [Products]
      summary: Obter produto por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                product:
                  id: "51f5e7da-b1cf-4bf6-8ec1-6a26dd4043ed"
                  name: "Filtro de Cabine"
                  price: 3800
                  stock: 8
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_NOT_FOUND
                message: product.not_found
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    patch:
      tags: [Products]
      summary: Atualizar produto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              name: "Óleo Sintético Premium"
              price: 11000
              stock: 30
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                product:
                  id: "7fdcb813-62ad-4d6d-80f5-750a6c31a808"
                  name: "Óleo Sintético Premium"
                  price: 11000
                  stock: 30
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_NOT_FOUND
                message: product.not_found
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "price: must be greater than 0"
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    delete:
      tags: [Products]
      summary: Remover produto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Produto removido
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /admin/services/{id}:
    get:
      tags: [Services]
      summary: Obter serviço por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Alinhamento e Balanceamento"
                  price_cents: 12000
                  currency: "BRL"
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    put:
      tags: [Services]
      summary: Atualizar serviço
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
            example:
              name: "Revisão Completa"
              price_cents: 15000
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Revisão Completa"
                  price_cents: 15000
                  currency: "BRL"
        '400':
          description: ID/JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "price_cents: must be greater than 0"
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    delete:
      tags: [Services]
      summary: Remover serviço
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removido com sucesso
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /admin/repair-orders/{id}/estimate:
    post:
      tags: [Estimates]
      summary: Criar orçamento a partir de ordem de serviço
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da ordem de serviço (repair order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateRequest'
            example:
              products:
                - id: "11111111-2222-3333-4444-555555555555"
                  quantity: 2
              services:
                - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  quantity: 1
      responses:
        '201':
          description: Orçamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateResponse'
              example:
                Estimate:
                  ID: "0f3b4a2e-7c1d-4b9b-8f1e-abcdefabcdef"
                  RepairOrderID: "123e4567-e89b-12d3-a456-426614174000"
                  Total:
                    Cents: 33000
        '400':
          description: ID da ordem inválido ou JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REPAIR_ORDER_ID
                message: invalid repair order id
        '404':
          description: Ordem de serviço não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REPAIR_ORDER_NOT_FOUND
                message: repair order not found
        '422':
          description: Status inválido da ordem de serviço
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REPAIR_ORDER_STATUS
                message: invalid repair order status
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Forneça o token no formato `Bearer <token>`.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: INVALID_BODY
        message:
          type: string
          example: invalid JSON body
      required: [code, message]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]
      example:
        email: admin@example.com
        password: password123
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
      required: [id, name, email, roles]
      example:
        id: d290f1ee-6c54-4b01-90e6-d701748f0851
        name: Admin User
        email: admin@example.com
        roles: [manager]
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Tempo em segundos até a expiração
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
      required: [access_token, token_type, expires_in, expires_at, user]
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type: Bearer
        expires_in: 3600
        expires_at: 2024-12-31T12:00:00Z
        user:
          id: d290f1ee-6c54-4b01-90e6-d701748f0851
          name: Admin User
          email: admin@example.com
          roles: [manager, attendant]
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
      required: [id, name, price_cents, currency]
    ServiceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Código da moeda (padrão BRL)
      required: [name, price_cents]
      example:
        name: "Alinhamento e Balanceamento"
        price_cents: 12000
        currency: "BRL"
    ServiceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
      example:
        name: "Revisão Completa"
        price_cents: 15000
    ServiceResponse:
      type: object
      properties:
        service:
          $ref: '#/components/schemas/Service'
      required: [service]
      example:
        service:
          id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
          name: "Alinhamento e Balanceamento"
          price_cents: 12000
          currency: "BRL"
    ServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
      required: [services]
      example:
        services:
          - id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
            name: "Alinhamento e Balanceamento"
            price_cents: 12000
            currency: "BRL"
          - id: "2d6b1a8f-9c4e-47f2-a1bc-1234567890ab"
            name: "Troca de Óleo"
            price_cents: 9000
            currency: "BRL"
    LinePayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required: [id, quantity]
    CreateEstimateRequest:
      type: object
      description: Pelo menos um de `products` ou `services` deve conter itens.
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/LinePayload'
        services:
          type: array
          items:
            $ref: '#/components/schemas/LinePayload'
      example:
        products:
          - id: "11111111-2222-3333-4444-555555555555"
            quantity: 2
        services:
          - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
            quantity: 1
    Money:
      type: object
      properties:
        Cents:
          type: integer
          format: int64
      required: [Cents]
    Estimate:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        RepairOrderID:
          type: string
          format: uuid
        Total:
          $ref: '#/components/schemas/Money'
      required: [ID, RepairOrderID, Total]
    CreateEstimateResponse:
      type: object
      properties:
        Estimate:
          $ref: '#/components/schemas/Estimate'
      required: [Estimate]
      example:
        Estimate:
          ID: "0f3b4a2e-7c1d-4b9b-8f1e-abcdefabcdef"
          RepairOrderID: "123e4567-e89b-12d3-a456-426614174000"
          Total:
            Cents: 33000
  /admin/estimates/{id}/approve:
    post:
      tags: [Estimates]
      summary: Aprovar orçamento
      description: Transiciona o orçamento para aguardando baixa de estoque e atualiza o status da ordem de reparo.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID do orçamento a ser aprovado
      responses:
        '200':
          description: Orçamento aprovado
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ESTIMATE_NOT_FOUND
