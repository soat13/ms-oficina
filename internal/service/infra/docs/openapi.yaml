openapi: "3.0.3"
info:
  title: Oficina API
  version: 1.0.0
  description: |
    API da Oficina (Fase 1).
    
    Esta especificação documenta os endpoints HTTP atuais, seguindo as camadas e decisões de DDD do projeto.
    
    Observações:
    - O grupo de rotas de serviços é exposto sob `/admin/services`.
    - A criação de orçamento (estimate) é feita a partir de uma ordem de serviço específica.
servers:
  - url: http://localhost:8080
    description: Ambiente local (PORT=8080)
tags:
  - name: Services
    description: Catálogo de serviços (admin)
  - name: Estimates
    description: Orçamentos gerados a partir de ordens de serviço
paths:
  /admin/services:
    get:
      tags: [Services]
      summary: Listar serviços
      description: Lista serviços com paginação simples por `limit` e `offset`.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Número máximo de itens retornados.
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Deslocamento para paginação.
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesResponse'
              example:
                services:
                  - id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                    name: "Alinhamento e Balanceamento"
                    price_cents: 12000
                    currency: "BRL"
                  - id: "2d6b1a8f-9c4e-47f2-a1bc-1234567890ab"
                    name: "Troca de Óleo"
                    price_cents: 9000
                    currency: "BRL"
    post:
      tags: [Services]
      summary: Criar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
            example:
              name: "Alinhamento e Balanceamento"
              price_cents: 12000
              currency: "BRL"
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Alinhamento e Balanceamento"
                  price_cents: 12000
                  currency: "BRL"
        '400':
          description: JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "name: must be at least 3 characters"
        '409':
          description: Serviço já existe (nome duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_ALREADY_EXISTS
                message: service with this name already exists
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /admin/services/{id}:
    get:
      tags: [Services]
      summary: Obter serviço por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Alinhamento e Balanceamento"
                  price_cents: 12000
                  currency: "BRL"
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    put:
      tags: [Services]
      summary: Atualizar serviço
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
            example:
              name: "Revisão Completa"
              price_cents: 15000
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                service:
                  id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
                  name: "Revisão Completa"
                  price_cents: 15000
                  currency: "BRL"
        '400':
          description: ID/JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: invalid JSON body
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '422':
          description: Validação de corpo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_BODY
                message: "price_cents: must be greater than 0"
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
    delete:
      tags: [Services]
      summary: Remover serviço
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removido com sucesso
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ID
                message: invalid id
        '404':
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_NOT_FOUND
                message: service not found
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
  /repair-orders/{id}/estimate:
    post:
      tags: [Estimates]
      summary: Criar orçamento a partir de ordem de serviço
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da ordem de serviço (repair order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateRequest'
            example:
              products:
                - id: "11111111-2222-3333-4444-555555555555"
                  quantity: 2
              services:
                - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  quantity: 1
      responses:
        '201':
          description: Orçamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateResponse'
              example:
                Estimate:
                  ID: "0f3b4a2e-7c1d-4b9b-8f1e-abcdefabcdef"
                  RepairOrderID: "123e4567-e89b-12d3-a456-426614174000"
                  Total:
                    Cents: 33000
        '400':
          description: ID da ordem inválido ou JSON inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REPAIR_ORDER_ID
                message: invalid repair order id
        '404':
          description: Ordem de serviço não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REPAIR_ORDER_NOT_FOUND
                message: repair order not found
        '422':
          description: Status inválido da ordem de serviço
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REPAIR_ORDER_STATUS
                message: invalid repair order status
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: internal error
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: INVALID_BODY
        message:
          type: string
          example: invalid JSON body
      required: [code, message]
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
      required: [id, name, price_cents, currency]
    ServiceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Código da moeda (padrão BRL)
      required: [name, price_cents]
      example:
        name: "Alinhamento e Balanceamento"
        price_cents: 12000
        currency: "BRL"
    ServiceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        price_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
      example:
        name: "Revisão Completa"
        price_cents: 15000
    ServiceResponse:
      type: object
      properties:
        service:
          $ref: '#/components/schemas/Service'
      required: [service]
      example:
        service:
          id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
          name: "Alinhamento e Balanceamento"
          price_cents: 12000
          currency: "BRL"
    ServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
      required: [services]
      example:
        services:
          - id: "7e9f2c3a-4b5d-4c0e-9f3b-1a2b3c4d5e6f"
            name: "Alinhamento e Balanceamento"
            price_cents: 12000
            currency: "BRL"
          - id: "2d6b1a8f-9c4e-47f2-a1bc-1234567890ab"
            name: "Troca de Óleo"
            price_cents: 9000
            currency: "BRL"
    LinePayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required: [id, quantity]
    CreateEstimateRequest:
      type: object
      description: Pelo menos um de `products` ou `services` deve conter itens.
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/LinePayload'
        services:
          type: array
          items:
            $ref: '#/components/schemas/LinePayload'
      example:
        products:
          - id: "11111111-2222-3333-4444-555555555555"
            quantity: 2
        services:
          - id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
            quantity: 1
    Money:
      type: object
      properties:
        Cents:
          type: integer
          format: int64
      required: [Cents]
    Estimate:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        RepairOrderID:
          type: string
          format: uuid
        Total:
          $ref: '#/components/schemas/Money'
      required: [ID, RepairOrderID, Total]
    CreateEstimateResponse:
      type: object
      properties:
        Estimate:
          $ref: '#/components/schemas/Estimate'
      required: [Estimate]
      example:
        Estimate:
          ID: "0f3b4a2e-7c1d-4b9b-8f1e-abcdefabcdef"
          RepairOrderID: "123e4567-e89b-12d3-a456-426614174000"
          Total:
            Cents: 33000

